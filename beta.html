<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Beta - SAGE POND</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
   
</head>

<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center">
        <div class="max-w-md w-full p-6 bg-white rounded-lg shadow-lg">
            <div class="text-center mb-8">
                 <img src="images/logo.svg" alt="SAGE POND Logo" class="mx-auto h-20 mb-4">
                <h2 class="text-2xl font-bold text-gray-900">Join Our Beta Program</h2>
                <p class="mt-2 text-gray-600">Be the first to experience our innovative solutions</p>
            </div>

            <form id="betaForm" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
                    <input type="email" id="email" name="email" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div class="flex items-start">
                    <input type="checkbox" id="privacy" name="privacy" required
                        class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                    <label for="privacy" class="ml-2 block text-sm text-gray-900">
                        I agree to the
                        <a href="/privacy-policy" class="text-indigo-600 hover:text-indigo-500">privacy policy</a>
                    </label>
                </div>

                <button  id="sub"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Join Beta Program
                </button>
            </form>
        </div>
    </div>

    <!-- Custom Popup -->
    <div id="popupOverlay" class="popup-overlay"></div>
    <div id="popup" class="popup">
        <div class="text-center">
            <div id="popupIcon" class="mx-auto mb-4"></div>
            <h3 id="popupTitle" class="text-lg font-semibold mb-2"></h3>
            <p id="popupMessage" class="text-gray-600 mb-4"></p>
            <button onclick="closePopup()" 
                class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Close
            </button>
        </div>
    </div>

    <script src="b.js"></script>
</body>
</html>
