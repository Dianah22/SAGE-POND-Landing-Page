<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="../main.css" rel="stylesheet">
     <link rel="stylesheet" href="css/chat/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.0/dist/purify.min.js"></script>
    <title>Unveyl</title>
</head>
<body class="bg-black overflow-hidden">
    <main class="flex flex-col h-screen">
        <div class = "content  w-full h-full items-center self-center"> 
          <div class="side-menu-button fixed top-0 z-[99] min-h-[40px] justify-center items-center flex mt-3 mr-0 mb-0 ml-4">
           <button class="p-2 flex-shrink text-white menuButton">  
             <span class="material-symbols-outlined">
            menu
            </span>
          </button>
          </div>
        <div class="side h-screen  text-center absolute  bg-[#141414] nav z-[30] ">
          
          <div class="side-button flex flex-col gap-y-4 pb-4 ps-2 " id="side_btn">
            <div class="new_conv-container flex h-full relative mt-32">
              <button class="relative grid side-b  h-[40px] min-w-[unset] max-w-fit me-4 ms-3  bg-blue-900  rounded-[40px] items-center justify-start"id='new_chat'>
                <span class="relative material-symbols-outlined text-2xl m-0  w-[24px] ">add</span>
                <span class="whitespace-nowrap overflow-hidden h-[40px] top-0 left-0 relative">
                  <span class="mt-2 mr-2 mb-2  block text-left text-ellipsis pr-2 pl-2 z-[1]">New Chat</span>
                </span>
                <span class='absolute top-1/2 left-0 right-0 h-[48px] -translate-y-1/2'></span>
              </button>
            </div>
          </div>
          <div class="title-cont text-white" id="recent_title">
                <h5>Recent</h5>
            </div>
        <div class ="recent  overflow-x-hidden h-56  text-2xl text-nowrap text-white">
            
            <div class="recent_chats overflow-x-hidden" id="recent">
            </div>
        </div>
    </div>
  <div class="chatarea h-screen top-0  right-0 absolute overflow-hidden  bg-zinc-950 text-white overflow-x-hidden w-full md:w-[calc(100%-25%)] ">
    <nav class="w-full z-20">
      
    </nav>
    <div class="h-screen rounded-[30px] w-full flex flex-wrap justify-center overflow-y-scroll">
    <div class="chat_window flex  flex-col pt-16 mb-44 w-[80%] "id='chat_window'>
      <div class="chat_history flex flex-col flex-1 w-full h-full flex-wrap content-center justify-center">
        <div class="welcome_screen max-w-[800px] w-full  flex flex-shrink-0  flex-wrap content-center h-[290px] justify-center flex-col">
          <div class="discover   flex   h-full">
               <div class="flex flex-col">
                <img src="images/logo.svg"class='h-[150px]'>
               </div>
          </div>
          </div>
        </div>
      
      <div class="query w-full flex p-3 ps-0 m-3 flex-1  flex-col absolute left-[15%]">
        </div>
        <div class="response_container ps-6 pt-1 flex-1 min-w-0 mt-[130px] absolute left-[15%]">
          <div class="response-content overflow-x-hidden">
        <div class="model_response flex flex-1 overflow-x-hidden">
            <div class="inner_container pt-0 flex mr-1 relative">
            </div>
        </div>
      </div>
      </div>
      </div>
        <div class="bottom flex absolute bottom-0  max-w-[900px] w-full z-10 self-center min-h-14 -mt-12 flex-col pl-5 pr-5 content-center    opacity-85  rounded-t-3xl rounded-r-3xl">
          <div class="input-cont-area w-full flex flex-col self-center text-center bg-[#141414]  max-w-[830px] rounded-3xl max-h-[200px] text-white">
            <div class="input-area relative p-0 inline-flex items-end ">
            <div class="prompt min-w-0 flex items-center justify-end flex-grow flex-wrap p-2 overflow-hidden rounded-3xl  z-10">
              <div class="text-area-wrapper ms-3 justify-between flex  flex-grow max-w-full self-stretch items-start">
                 <div class="items-center self-end flex-initial mb-1 min-h-9">
                 </div>
                <div class="w-full h-full">
                  <div class="relative h-full">
                    <div class="editor ps-0 overflow-auto break-normal leading-5 h-full p-3 whitespace-pre-wrap text-left max-h-[100px]  " contenteditable="true" role="textbox" aria-multiline="true" aria-label="input for prmpt" data-placeholder="Enter Prompt here" id="editor">
                    </div>
                  </div>
                 </div>
              </div>
              <div class="ms-2 flex">
                <div class="send">
                  <button id="send" disabled>
                    <span class="material-symbols-outlined">
                      send
                      </span>
                  </button>
                  
                 </div>
              </div>
            </div>
          </div>
          </div>
         <div class="capabilities text-center text-lg">
            <p>I May Generate Inaccurate Response's.</p>
         </div>
        </div>
      </div>
      </div>
      </div>
    </div>
  </main>
  <script src="gsap-public/gsap.min.js"></script>
  <script src="js/chat/bundle.chat.js"></script>
  </body>
  </html>
