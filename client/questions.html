<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unveyl - Answer Questions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- Header -->
    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold text-gray-800">Unveyl</div>
            <div>
                <a href="/opensource" class="text-gray-600 hover:text-gray-800 px-3 py-2">Home</a>
                <a href="/leaderboard" class="text-gray-600 hover:text-gray-800 px-3 py-2">Leaderboard</a>
                <a href="/questions" class="text-gray-600 hover:text-gray-800 px-3 py-2">Answer Questions</a>
            </div>
        </nav>
    </header>

    <!-- Questions Section -->
    <section class="py-20">
        <div class="container mx-auto px-6">
            <h1 class="text-4xl font-bold text-center text-gray-800 mb-12">Answer a Question</h1>
            <div id="question-container" class="bg-white shadow-md rounded-lg p-8">
                <!-- Question will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-10 mt-20">
        <div class="container mx-auto px-6 text-center">
            <p>&copy; 2024 Unveyl. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const questionContainer = document.getElementById('question-container');

            async function fetchQuestion() {
                try {
                    const response = await fetch('https://sagepond--uvveyl-unveyl.modal.run/');
                    const data = await response.json();
                    const question = data.response || data;
                    
                    questionContainer.innerHTML = `
                        <p class="text-xl mb-4">${question}</p>
                        <div class="flex space-x-4 mb-4">
                            <button id="text-answer-btn" class="bg-blue-600 text-white font-bold rounded-full py-2 px-4 hover:bg-blue-700">Answer with Text</button>
                            <button id="voice-answer-btn" class="bg-green-600 text-white font-bold rounded-full py-2 px-4 hover:bg-green-700">Answer with Voice</button>
                        </div>
                        <div id="text-answer-section">
                            <textarea id="answer" class="w-full p-2 border rounded" rows="4" placeholder="Your answer..."></textarea>
                            <button id="submit-text-answer" class="bg-blue-600 text-white font-bold rounded-full py-2 px-4 mt-4 hover:bg-blue-700">Submit Text Answer</button>
                        </div>
                        <div id="voice-answer-section" class="hidden">
                            <button id="record-btn" class="bg-red-600 text-white font-bold rounded-full py-2 px-4 hover:bg-red-700">Record</button>
                            <button id="stop-record-btn" class="bg-gray-600 text-white font-bold rounded-full py-2 px-4 hover:bg-gray-700" disabled>Stop</button>
                            <audio id="audio-playback" controls class="mt-4"></audio>
                            <button id="submit-voice-answer" class="bg-green-600 text-white font-bold rounded-full py-2 px-4 mt-4 hover:bg-green-700" disabled>Submit Voice Answer</button>
                        </div>
                    `;
                } catch (error) {
                    console.error('Error fetching question:', error);
                    questionContainer.innerHTML = '<p>Failed to load question. Please try again later.</p>';
                }
            }

            let mediaRecorder;
            let audioChunks = [];

            questionContainer.addEventListener('click', async (event) => {
                if (event.target.id === 'text-answer-btn') {
                    document.getElementById('text-answer-section').classList.remove('hidden');
                    document.getElementById('voice-answer-section').classList.add('hidden');
                } else if (event.target.id === 'voice-answer-btn') {
                    document.getElementById('text-answer-section').classList.add('hidden');
                    document.getElementById('voice-answer-section').classList.remove('hidden');
                } else if (event.target.id === 'record-btn') {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.start();
                    audioChunks = [];
                    document.getElementById('record-btn').disabled = true;
                    document.getElementById('stop-record-btn').disabled = false;
                    mediaRecorder.addEventListener('dataavailable', (event) => {
                        audioChunks.push(event.data);
                    });
                } else if (event.target.id === 'stop-record-btn') {
                    mediaRecorder.stop();
                    document.getElementById('record-btn').disabled = false;
                    document.getElementById('stop-record-btn').disabled = true;
                    mediaRecorder.addEventListener('stop', () => {
                        const audioBlob = new Blob(audioChunks);
                        const audioUrl = URL.createObjectURL(audioBlob);
                        const audioPlayback = document.getElementById('audio-playback');
                        audioPlayback.src = audioUrl;
                        document.getElementById('submit-voice-answer').disabled = false;
                    });
                } else if (event.target.id === 'submit-text-answer') {
                    const question = questionContainer.querySelector('p').textContent;
                    const answer = document.getElementById('answer').value;

                    if (answer) {
                        submitAnswer({ question, answer });
                    }
                } else if (event.target.id === 'submit-voice-answer') {
                    const question = questionContainer.querySelector('p').textContent;
                    const audioBlob = new Blob(audioChunks);
                    submitAnswer({ question, audioBlob });
                }
            });

            async function submitAnswer(data) {
                const { question, answer, audioBlob } = data;
                let audioURL;

                if (audioBlob) {
                    const storageRef = firebase.storage().ref();
                    const audioRef = storageRef.child(`audio/${new Date().getTime()}.wav`);
                    const snapshot = await audioRef.put(audioBlob);
                    audioURL = await snapshot.ref.getDownloadURL();
                }

                try {
                    const response = await fetch('/api/submit-answer', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            question,
                            answer: answer || null,
                            audioURL: audioURL || null,
                        }),
                    });

                    if (response.ok) {
                        fetchQuestion(); // Fetch a new question
                    } else {
                        console.error('Failed to submit answer');
                    }
                } catch (error) {
                    console.error('Error submitting answer:', error);
                }
            }

            fetchQuestion();
        });
    </script>
</body>
</html>
