<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <link href="css/main.css" rel="stylesheet">
</head>
<body class="flex items-center justify-center h-screen bg-gray-100">

    <div class="bg-white p-8 rounded shadow-md w-full sm:w-96">
        <h2 class="text-2xl font-semibold mb-4">Create an Account</h2>

        <!-- Sign Up Form -->
        <form action="/api/signup" method="post">
            <div class="mb-4">
                <label for="name" class="block text-sm font-medium text-gray-600">Name</label>
                <input type="text" id="name" name="name" class="mt-1 p-2 w-full border rounded-md">
            </div>

            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-600">Email</label>
                <input type="email" id="email" name="email" class="mt-1 p-2 w-full border rounded-md">
                <input type="hidden" name="_csrf" value="<%= csrfToken %>">
            </div>

            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-gray-600">Password</label>
                <input type="password" id="password" name="password" class="mt-1 p-2 w-full border rounded-md">
            </div>

            <button type='submit' id='submit' class="bg-indigo-500 text-white px-4 py-2 rounded-md">Sign Up</button>
        </form>

        <hr class="my-4">

        <!-- Login Section -->
        <p class="text-gray-600">Already have an account? <a href="/login" class="text-indigo-500">Login</a></p>
    </div>
<script src="js/signup/bundle.signup.js"></script>
</body>
</html>
