<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unveyl - Leaderboard</title>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- Header -->
    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold text-gray-800">Unveyl</div>
            <div>
                <a href="/opensource" class="text-gray-600 hover:text-gray-800 px-3 py-2">Home</a>
                <a href="/leaderboard" class="text-gray-600 hover:text-gray-800 px-3 py-2">Leaderboard</a>
            </div>
        </nav>
    </header>

    <!-- Leaderboard Section -->
    <section class="py-20">
        <div class="container mx-auto px-6">
            <h1 class="text-4xl font-bold text-center text-gray-800 mb-12">Top Contributors</h1>
            <div class="bg-white shadow-md rounded-lg p-8">
                <table class="w-full text-left">
                    <thead>
                        <tr>
                            <th class="py-2 px-4 border-b">Rank</th>
                            <th class="py-2 px-4 border-b">User</th>
                            <th class="py-2 px-4 border-b">Contributions</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Leaderboard data will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-10 mt-20">
        <div class="container mx-auto px-6 text-center">
            <p>&copy; 2024 Unveyl. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/leaderboard');
                const leaderboardData = await response.json();
                const leaderboardBody = document.getElementById('leaderboard-body');

                leaderboardBody.innerHTML = ''; // Clear existing data

                leaderboardData.forEach((entry, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="py-2 px-4 border-b">${index + 1}</td>
                        <td class="py-2 px-4 border-b">${entry.user}</td>
                        <td class="py-2 px-4 border-b">${entry.count}</td>
                    `;
                    leaderboardBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching leaderboard data:', error);
            }
        });
    </script>
</body>
</html>
