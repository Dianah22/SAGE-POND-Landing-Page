<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="flex items-center justify-center h-screen bg-gray-100">

    <div class="bg-white p-8 rounded shadow-md w-full sm:w-96">
        <h2 class="text-2xl font-semibold mb-4">Welcome Back!</h2>

        <!-- Login Form -->
        <form action="#" method="post">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-600">Email</label>
                <input type="email" id="email" name="email" class="mt-1 p-2 w-full border rounded-md">
            </div>

            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-gray-600">Password</label>
                <input type="password" id="password" name="password" class="mt-1 p-2 w-full border rounded-md">
            </div>

            <div class="flex items-center justify-between mb-4">
                <button type="submit" class="bg-indigo-500 text-white px-4 py-2 rounded-md"id='login'>Login</button>
                <a href="#" class="text-indigo-500">Forgot Password?</a>
            </div>
        </form>

        <hr class="my-4">

        <!-- Sign Up Section -->
        <p class="text-gray-600">Don't have an account? <a href="/signup" class="text-indigo-500">Sign Up</a></p>
    </div>

</body>
<script src="login.js"></script>
</html>
