<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SAGE POND</title>
	<link rel="stylesheet" href="main.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="icon" type="image/png" href="images/favico.png">
	<link
		href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
		rel="stylesheet">
	<script async="" src="https://www.googletagmanager.com/gtag/js?id=G-ZBXL6BYV15"></script>
	<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag() { dataLayer.push(arguments); }
		gtag('js', new Date());

		gtag('config', 'G-ZBXL6BYV15');
	</script>
</head>
<style>
	body {
		font-family: 'DM Sans', sans-serif;
	}
</style>

<body>
	<header class="h-screen w-screen bg-[#1B04BE]">


		<div class="cont h-full w-full  text-white flex flex-col items-center justify-center relative">
			<img src="images/1440p.svg" alt="background" id="background">
			<div class='texts flex flex-col z-999 absolute justify-center text-center m-12 gap-4'>
				<h1 class="text-white text-4xl md:text-6xl font-extrabold">BUILDING UGANDA’S AI INFRASTRUCTURE</h1>
				<p class="text-white text-xl md:text-2xl ">Datasets, models, evaluation systems, and APIs designed for
					local
					languages and real-world deployment. Build AI products without rebuilding the core stack.</p>
				<div class="flex flex-row items-center justify-center gap-4">
					<button id="join-waitlist-btn"
						class="bg-white text-black px-4 py-2 rounded-full cursor-pointer">Join
						Waitlist</button>

				</div>
				<div class="badges flex flex-col items-center justify-center">
					<img src="images/partner.svg" alt="partner" style="width: 400px;">
				</div>
			</div>
		</div>

	</header>

	<!-- Waitlist Modal -->
	<div id="waitlist-modal"
		class="fixed inset-0 z-[1000] flex items-center justify-center p-4 bg-black/60 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
		<div
			class="bg-black backdrop-blur-xl border border-white/20 p-8 rounded-3xl w-full max-w-md shadow-2xl relative">
			<button id="close-modal" class="absolute top-4 right-4 text-white/50 hover:text-white cursor-pointer">
				<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
					<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
					</path>
				</svg>
			</button>
			<div class="text-center">
				<h2 class="text-white text-3xl font-bold mb-4">Join the Waitlist</h2>
				<p class="text-white/70 mb-8">Be the first to build with SAGE POND. Early access coming in Q2.</p>

				<form id="waitlist-form" class="space-y-4">
					<div>
						<input type="email" id="waitlist-email" required placeholder="Enter your email"
							class="w-full bg-white/10 border border-white/20 rounded-2xl px-6 py-4 text-white focus:outline-none focus:ring-2 focus:ring-white/50 transition-all placeholder:text-white/30">
					</div>
					<div id="turnstile-container" class="flex justify-center"></div>
					<button type="submit" id="submit-waitlist"
						class="w-full bg-white text-black font-bold py-4 rounded-2xl hover:bg-blue-50 transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
						Get Early Access
					</button>
					<p id="modal-message" class="text-sm mt-4 hidden"></p>
				</form>
			</div>
		</div>
	</div>

	<script src="js/app.js"></script>

</body>

</html>
