<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAGE POND | Verify Email</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Verify Email CSS -->
    <link rel="stylesheet" href="../.css Files/verify-email.css">

</head>

<body>

    <div class="verify-container">

        <div class="verify-card">

            <img
                src="../images/logo.png"
                alt="SAGE POND Logo"
                class="verify-logo"
            >

            <h1>
                Check Your Email
            </h1>

            <p>
                We have sent a verification link to your email address.
            </p>

            <p>
                Please check your inbox and click the link to verify your account before logging in.
            </p>

            <!-- Verification Status Message -->

            <p id="verifyMessage">
                Please verify your email address before continuing.
            </p>


            <!-- Check Verification Button -->

            <button
                id="checkVerification"
                class="verify-btn"
            >
                I have verified my email
            </button>


            <!-- Resend Verification Email Button -->

            <button
                id="resendEmail"
                class="verify-btn"
            >
                Resend Verification Email
            </button>


            <a href="Login.html" class="verify-btn">
                Go to Login
            </a>


            <p class="back-home">

                <a href="index.html">
                    ← Back to Home
                </a>

            </p>

        </div>

    </div>


    <!-- Verify Email JavaScript -->

    <script
        type="module"
        src="../.js Files/verify-email.js"
    ></script>

</body>

</html>
