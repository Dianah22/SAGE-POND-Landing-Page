<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAGE POND | Sign Up</title>


    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- Signup Page CSS -->

    <link
        rel="stylesheet"
        href="/css/signup.css"
    >

</head>


<body>


    <!-- =========================
         SIGNUP PAGE
    ========================== -->

    <div class="signup-container">


        <!-- =========================
             LEFT SIDE
        ========================== -->

        <div class="signup-left">

            <div class="signup-left-content">

                <img
                    src="/images/logo.png"
                    alt="SAGE POND Logo"
                    class="signup-logo"
                >

                <h1>
                    Create Your Account
                </h1>

                <p>
                    Join SAGE POND and become part of a community
                    building AI solutions, language technologies,
                    and research-driven innovation for Africa.
                </p>

            </div>

        </div>


        <!-- =========================
             RIGHT SIDE
        ========================== -->

        <div class="signup-right">

            <div class="signup-card">


                <!-- Heading -->

                <div class="signup-header">

                    <h2>
                        Sign Up
                    </h2>

                    <p>
                        Create your SAGE POND account
                    </p>

                </div>


                <!-- Signup Form -->

                <form id="signupForm">


                    <!-- Full Name -->

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-user"></i>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Enter your full name"
                                autocomplete="name"
                                required
                            >

                        </div>

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                        </div>

                        <small>
                            Password must be at least 8 characters long.
                        </small>

                    </div>


                    <!-- Confirm Password -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                        </div>

                    </div>


                    <!-- Signup Message -->

                    <p
                        id="signupMessage"
                        class="signup-message"
                        aria-live="polite"
                    ></p>


                    <!-- Create Account Button -->

                    <button
                        type="submit"
                        class="signup-btn"
                    >

                        <span>
                            Create Account
                        </span>

                    </button>


                </form>


                <!-- Login Link -->

                <p class="account-link">

                    Already have an account?

                    <a href="/login">
                        Login here
                    </a>

                </p>


                <!-- Back Home -->

                <p class="back-home">

                    <a href="/home">

                        <i
                            class="fa-solid fa-arrow-left"
                            aria-hidden="true"
                        ></i>

                        Back to Home

                    </a>

                </p>


            </div>

        </div>


    </div>


    <!-- =========================
         SIGNUP JAVASCRIPT
    ========================== -->

    <script
        type="module"
        src="/js/SignUp.js"
    ></script>


</body>

</html>
