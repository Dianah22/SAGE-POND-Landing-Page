<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAGE POND | Login</title>


    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- Login Page CSS -->

    <link
        rel="stylesheet"
        href="/css/login.css"
    >

</head>


<body>


    <!-- =========================
         LOGIN PAGE
    ========================== -->

    <div class="login-container">


        <!-- =========================
             LEFT SIDE
        ========================== -->

        <div class="login-left">

            <div class="login-left-content">

                <img
                    src="/images/logo.png"
                    alt="SAGE POND Logo"
                    class="login-logo"
                >

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Sign in to continue exploring AI research,
                    language technologies, and innovative
                    solutions built for Africa.
                </p>

            </div>

        </div>


        <!-- =========================
             RIGHT SIDE
        ========================== -->

        <div class="login-right">

            <div class="login-card">


                <!-- =========================
                     LOGIN HEADER
                ========================== -->

                <div class="login-header">

                    <h2>
                        Sign In
                    </h2>

                    <p>
                        Welcome back to SAGE POND
                    </p>

                </div>


                <!-- =========================
                     LOGIN FORM
                ========================== -->

                <form id="loginForm">


                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <div class="input-wrapper">

                            <i
                                class="fa-solid fa-envelope"
                                aria-hidden="true"
                            ></i>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <i
                                class="fa-solid fa-lock"
                                aria-hidden="true"
                            ></i>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                        </div>

                    </div>


                    <!-- Login Message -->

                    <p
                        id="loginMessage"
                        class="login-message"
                        aria-live="polite"
                    ></p>


                    <!-- Login Button -->

                    <button
                        type="submit"
                        class="login-btn"
                    >

                        <span>
                            Login
                        </span>

                    </button>

                </form>


                <!-- =========================
                     SIGN UP LINK
                ========================== -->

                <p class="account-link">

                    Don't have an account?

                    <a href="/signup">
                        Sign up here
                    </a>

                </p>


                <!-- =========================
                     BACK HOME
                ========================== -->

                <p class="back-home">

                    <a href="/home">

                        <i
                            class="fa-solid fa-arrow-left"
                            aria-hidden="true"
                        ></i>

                        Back to Home

                    </a>

                </p>


            </div>

        </div>


    </div>


    <!-- =========================
         LOGIN JAVASCRIPT
    ========================== -->

    <script
        type="module"
        src="/js/Login.js"
    ></script>


</body>

</html>
